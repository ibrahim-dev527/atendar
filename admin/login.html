<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Sign In · Atendar</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#070b1a">
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/logo-192.png">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="login-wrap"><main class="login-card" id="app">
    <header class="topbar reveal"><a class="brand" href="/"><img class="logo" src="/assets/logo-192.png" alt="Atendar logo" width="44" height="44"><span>Atendar<small>Staff portal</small></span></a><a class="btn small ghost" href="/">← Home</a></header>
    <section class="card glow reveal">
      <h2>Staff sign in 🔐</h2>
      <p class="muted">For administrators, lecturers and course representatives.</p>
      <div class="notice bad hidden" id="cfgWarn"><span>🔧</span><span>This site isn't connected to Supabase yet. See the README.</span></div>
      <form id="form" novalidate>
        <div class="field"><label for="email">Email</label><input id="email" class="input" type="email" autocomplete="username" placeholder="you@example.com"></div>
        <div class="field"><label for="pw">Password</label><input id="pw" class="input" type="password" autocomplete="current-password" placeholder="••••••••"></div>
        <div class="err" id="err" role="alert"></div>
        <button class="btn primary big" id="btn" type="submit"><span class="lbl">Sign in</span></button>
      </form>
      <p class="hint" style="margin-top:14px">Forgot your password? Ask a Super Administrator to reset it from the Supabase dashboard.</p>
    </section>
  </main></div>
  <script type="module" src="/js/pages/admin-login.js"></script>
</body>
</html>
